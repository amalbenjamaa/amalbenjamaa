<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="Pink laptop with code, hearts and sparkles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3F1"/>
      <stop offset="1" stop-color="#E6D9FF"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1F66"/>
      <stop offset="1" stop-color="#5B2A86"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC2E0"/>
      <stop offset="1" stop-color="#F7A8D0"/>
    </linearGradient>
    <path id="heart" d="M0,-4 C-6,-12 -18,-4 -9,6 L0,15 L9,6 C18,-4 6,-12 0,-4 Z"/>
    <path id="spark" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z"/>
  </defs>

  <rect width="420" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="58" cy="62" r="46" fill="#FFB6DA" opacity=".35"/>
  <circle cx="372" cy="268" r="62" fill="#B8E8FF" opacity=".5"/>
  <circle cx="352" cy="52" r="26" fill="#FFE9A8" opacity=".6"/>

  <!-- laptop -->
  <rect x="95" y="70" width="230" height="150" rx="14" fill="#8B5CC9"/>
  <rect x="105" y="80" width="210" height="130" rx="8" fill="url(#scr)"/>
  <circle cx="120" cy="92" r="3.5" fill="#FF8FC7"/>
  <circle cx="132" cy="92" r="3.5" fill="#FFD36E"/>
  <circle cx="144" cy="92" r="3.5" fill="#8BE9C8"/>

  <!-- animated code lines -->
  <rect x="120" y="108" height="8" rx="4" fill="#FF8FC7">
    <animate attributeName="width" values="0;90;90;0" keyTimes="0;0.25;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="134" y="124" height="8" rx="4" fill="#8BE9C8">
    <animate attributeName="width" values="0;130;130;0" keyTimes="0;0.35;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="134" y="140" height="8" rx="4" fill="#FFD36E">
    <animate attributeName="width" values="0;70;70;0" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="134" y="156" height="8" rx="4" fill="#C9A7FF">
    <animate attributeName="width" values="0;110;110;0" keyTimes="0;0.55;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="172" height="8" rx="4" fill="#7FD3FF">
    <animate attributeName="width" values="0;60;60;0" keyTimes="0;0.65;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="190" width="8" height="12" rx="2" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- base -->
  <rect x="70" y="220" width="280" height="16" rx="8" fill="url(#base)"/>
  <rect x="175" y="220" width="70" height="6" rx="3" fill="#F48DBF"/>

  <!-- floating hearts -->
  <g transform="translate(60,170)">
    <use href="#heart" fill="#FF6FB1"/>
    <animateTransform attributeName="transform" type="translate" values="60,170;60,155;60,170" dur="3s" repeatCount="indefinite"/>
  </g>
  <g>
    <use href="#heart" fill="#C9A7FF" transform="scale(.7)"/>
    <animateTransform attributeName="transform" type="translate" values="360,150;360,135;360,150" dur="3.6s" repeatCount="indefinite"/>
  </g>
  <g>
    <use href="#heart" fill="#FFB6DA" transform="scale(.55)"/>
    <animateTransform attributeName="transform" type="translate" values="340,100;340,88;340,100" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- sparkles -->
  <g transform="translate(70,100)">
    <use href="#spark" fill="#FFD36E"/>
    <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(350,200) scale(.8)">
    <use href="#spark" fill="#FFFFFF"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(210,40) scale(.7)">
    <use href="#spark" fill="#FF8FC7"/>
    <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(110,270) scale(.9)">
    <use href="#spark" fill="#8BE9C8"/>
    <animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/>
  </g>
</svg>
